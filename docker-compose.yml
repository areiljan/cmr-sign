name: cmr-sign

services:
  datastore:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cmrsign
      POSTGRES_USER: cmrsign
      POSTGRES_PASSWORD: cmrsign
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmrsign -d cmrsign"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - datastore-data:/var/lib/postgresql/data

  service:
    build: .
    environment:
      ENV: "dev"
      PORT: "8080"
      DB_URL: "jdbc:postgresql://datastore:5432/cmrsign"
      DB_USER: "cmrsign"
      DB_PASS: "cmrsign"
      PLATFORM_API_KEY: ${PLATFORM_API_KEY:?set PLATFORM_API_KEY (see .env.example)}
    depends_on:
      datastore:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  datastore-data:
